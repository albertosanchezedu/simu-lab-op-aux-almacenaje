<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimuLab · Operaciones Auxiliares de Almacenaje</title>
<meta name="description" content="Simulador 3D de Operaciones Auxiliares de Almacenaje: ordena el almacén de Serenitos y aprende a pensar como un profesional.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="core/estilo.css?v=2">
</head>
<body>
<div class="sl-raiz" id="sl-raiz">
  <!-- 1 · Barra: solo el nombre del simulador, dónde estoy y el botón de volver al almacén -->
  <header class="sl-barra sl-cristal">
    <div class="sl-marca"><p class="sl-marca__nombre" id="sl-marca">SimuLab</p></div>
    <div class="sl-donde" aria-live="polite">
      <p class="sl-donde__txt" id="sl-donde"></p>
      <span class="sl-donde__barra"><span id="sl-donde-barra"></span></span>
    </div>
    <div class="sl-partes">
      <button type="button" class="sl-btn sl-btn--partes" id="sl-mapa" aria-label="Volver al almacén"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5zM9 4v13.5m6-11V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg> Mapa</button>
    </div>
  </header>

  <main class="sl-app" id="sl-app">
    <!-- 2 · El escenario: el almacén en 3D, o la lámina para leer, copiar y responder -->
    <section class="sl-escenario" id="sl-escenario" aria-label="Almacén">
      <div class="sl-lienzo" id="sl-lienzo"></div>
      <div class="sl-ficha sl-cristal" id="sl-ficha" hidden></div>
      <div class="sl-lamina" id="sl-lamina" hidden></div>
    </section>

    <!-- 3 · Alberto o María: lo que hay que hacer ahora -->
    <aside class="sl-panel sl-cristal" aria-label="Guía">
      <div class="sl-panel__alberto" id="sl-panel"></div>
      <div class="sl-pasos">
        <button type="button" class="sl-btn" id="sl-atras" aria-label="Atrás"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="sl-btn sl-btn--oscuro" id="sl-siguiente">Siguiente →</button>
      </div>
    </aside>
  </main>

  <footer class="sl-pie" id="sl-pie"></footer>
</div>

<button type="button" class="sl-ayuda" id="sl-ayuda" aria-label="Información" aria-expanded="false" aria-controls="sl-creditos">?</button>
<div class="sl-creditos sl-cristal" id="sl-creditos" role="dialog" aria-label="Información" hidden></div>

<!-- Motor común -->
<script src="vendor/three.min.js?v=2"></script>
<script src="core/simulab.js?v=2"></script>
<script src="core/pantallas.js?v=2"></script>
<script src="core/mundo3d.js?v=2"></script>
<script src="core/guia.js?v=2"></script>
<script src="core/juego.js?v=2"></script>
<!-- Mundo común (la nave de Serenitos, personajes y prólogo) -->
<script src="mundo/mundo.js?v=2"></script>
<script src="mundo/historia.js?v=2"></script>
<!-- Unidades de trabajo: cada una en su carpeta -->
<script src="unidades/ut3-almacenaje/ut3.js?v=2"></script>
<!-- Sesión después de las unidades (el código de partida usa sus capítulos) -->
<script src="core/sesion.js?v=2"></script>
<script src="core/app.js?v=2"></script>
<script>SimuLab.App.iniciar();</script>
</body>
</html>
